name: validate

on:
  push:
    branches: [main, master, "candidate/**"]
  pull_request:

jobs:
  exhibits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate exhibits
        run: npm run validate
