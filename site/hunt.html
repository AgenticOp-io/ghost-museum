<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hunt desk · Still Answering</title>
  <meta name="description" content="Hunt findings — signal view. DNS noise hidden. Hangs via hang:auto." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./museum.css" />
</head>
<body class="gm-hunt-page">
  <header class="gm-masthead gm-masthead--wide">
    <a class="gm-side-frame gm-nominate-frame" href="./nominate.html">
      <span class="gm-nominate-label">Nominate<br />a ghost</span>
    </a>
    <div class="gm-mast-main">
      <p class="gm-brand-title"><a href="./index.html">Still Answering</a></p>
      <p class="gm-hero-tag">
        <span class="gm-hero-line">Sunset is a press release.</span>
        <span class="gm-hero-line">Ghosts are a runtime.</span>
      </p>
      <nav class="gm-nav" aria-label="Hall">
        <a href="./index.html">Hall</a>
        <a href="./about.html">Plaque</a>
        <a href="./nominate.html">Nominate</a>
        <a href="./hunt.html" aria-current="page">Hunt</a>
        <a href="./curate.html">Curate</a>
      </nav>
    </div>
    <aside class="gm-side-frame gm-count-frame" aria-live="polite" aria-atomic="true" aria-label="Ghost census">
      <p class="gm-side-kicker gm-count-wall">Ghosts</p>
      <p class="gm-count-num" id="ghost-count">…</p>
      <p class="gm-count-meta" id="ghost-count-meta">on wall</p>
    </aside>
  </header>

  <div class="gm-shell">
    <main class="gm-nominate-main">
      <section class="gm-nominate-hero">
        <h1>Hunt desk.</h1>
        <p class="gm-lede" id="hunt-meta">Signal view — DNS misses and invented deep hosts stay hidden.</p>
        <div class="gm-view-modes" id="hunt-filters" role="group" aria-label="Hunt filter">
          <button type="button" class="gm-filter" data-wall="signal" aria-pressed="true">Signal</button>
          <button type="button" class="gm-filter" data-wall="still-answering" aria-pressed="false">Still answering</button>
          <button type="button" class="gm-filter" data-wall="successor-facade" aria-pressed="false">Successor</button>
          <button type="button" class="gm-filter" data-wall="all" aria-pressed="false">All contacted</button>
          <button type="button" class="gm-filter" data-wall="noise" aria-pressed="false">DNS noise</button>
        </div>
      </section>

      <div id="hunt-list" class="gm-hunt-list" aria-live="polite"></div>
    </main>

    <footer class="gm-footer">
      <a href="https://agenticop.io/" rel="noopener noreferrer">agenticop.io</a>
      · Apache-2.0
      · © 2026 AgenticOps
    </footer>
  </div>
  <script src="./hunt-desk.js" type="module"></script>
  <script src="./gm-census-boot.js" type="module"></script>
</body>
</html>
