<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="Ghosts hung under one major domain." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./museum.css" />
</head>
<body class="gm-hall-page gm-domain-page">
  <header class="gm-masthead gm-masthead--wide">
    <a class="gm-side-frame gm-nominate-frame" href="./nominate.html">
      <span class="gm-nominate-label">Nominate<br />a ghost</span>
    </a>
    <div class="gm-mast-main">
      <p class="gm-brand-title"><a href="./index.html">Still Answering</a></p>
      <p class="gm-hero-tag">
        <span class="gm-hero-line">Sunset is a press release.</span>
        <span class="gm-hero-line">Ghosts are a runtime.</span>
      </p>
      <nav class="gm-nav" aria-label="Hall">
        <a href="./index.html">Hall</a>
        <a href="./about.html">Plaque</a>
        <a href="./nominate.html">Nominate</a>
        <a href="./hunt.html">Hunt</a>
        <a href="./curate.html">Curate</a>
      </nav>
    </div>
    <aside class="gm-side-frame gm-count-frame" aria-live="polite" aria-atomic="true" aria-label="Ghost census">
      <p class="gm-side-kicker gm-count-wall">Ghosts</p>
      <p class="gm-count-num" id="ghost-count">…</p>
      <p class="gm-count-meta" id="ghost-count-meta">on wall</p>
    </aside>
  </header>

  <div class="gm-shell">
    <section class="gm-hero gm-domain-hero">
      <p class="gm-kicker"><a href="./index.html?view=domain">← All domains</a></p>
      <h1 id="domain-title">…</h1>
      <p class="gm-hero-tag" id="domain-tag">Ghosts under this domain</p>
    </section>

    <div class="gm-toolbar">
      <div class="gm-legend" id="wall-filters" aria-label="Wall filters">
        <button type="button" class="gm-filter" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="gm-filter" data-filter="still-answering" aria-pressed="false"><i class="still" aria-hidden="true"></i> Still answering</button>
        <button type="button" class="gm-filter" data-filter="auth-ghost" aria-pressed="false"><i class="auth" aria-hidden="true"></i> Auth ghost</button>
        <button type="button" class="gm-filter" data-filter="successor-facade" aria-pressed="false"><i class="facade" aria-hidden="true"></i> Successor facade</button>
        <button type="button" class="gm-filter" data-filter="buried" aria-pressed="false"><i class="buried" aria-hidden="true"></i> Buried</button>
        <button type="button" class="gm-filter" data-filter="banished" aria-pressed="false"><i class="banished" aria-hidden="true"></i> Banished</button>
      </div>
    </div>

    <main id="hall" class="gm-hall" aria-label="Domain exhibits"></main>

    <footer class="gm-footer">
      <a href="https://agenticop.io/" rel="noopener noreferrer">agenticop.io</a>
      · Apache-2.0
      · © 2026 AgenticOps
    </footer>
  </div>
  <script src="./domain.js" type="module"></script>
  <script src="./gm-census-boot.js" type="module"></script>
</body>
</html>
