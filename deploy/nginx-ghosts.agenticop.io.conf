# Ghost Museum — ghosts.agenticop.io (chrysalis-test-vm nginx)

# HTTP → ACME + redirect
server {
    listen 80;
    listen [::]:80;
    server_name ghosts.agenticop.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ghost-museum/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS → local demo server (static + nominate API)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ghosts.agenticop.io;

    ssl_certificate     /etc/letsencrypt/live/ghosts.agenticop.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghosts.agenticop.io/privkey.pem;

    # Temporary until cert exists — install script comments these and uses :80 only first.

    location / {
        proxy_pass http://127.0.0.1:19191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
